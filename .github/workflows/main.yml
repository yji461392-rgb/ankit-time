name: Build ANKIT TIME APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android SDK tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create test app
        run: |
          mkdir www
          echo '<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><h1>ANKIT TIME</h1><p>Test app</p></body></html>' > www/index.html
          npx cap init "ANKIT TIME" "com.ankittime.study" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK
        uses: android-actions/setup-android@v3

      - name: Compile APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANKIT-TIME-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
