
name: Build ANKIT TIME APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Download website
        run: |
          mkdir www
          curl -fL "https://yji461392-rgb.github.io/ankit-time/" -o /tmp/site.html
          cp /tmp/site.html www/index.html

      - name: Configure Android app
        run: |
          npx cap init "ANKIT TIME" "com.ankittime.study" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Prepare app icon
        run: |
          sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          for size in 48 72 96 144 192; do
            case $size in
              48) folder=mipmap-mdpi ;;
              72) folder=mipmap-hdpi ;;
              96) folder=mipmap-xhdpi ;;
              144) folder=mipmap-xxhdpi ;;
              192) folder=mipmap-xxxhdpi ;;
            esac
            convert app-icon.jpg -resize ${size}x${size}^ -gravity center -extent ${size}x${size} android/app/src/main/res/$folder/ic_launcher.png
          done
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@mipmap/ic_launcher"|' android/app/src/main/AndroidManifest.xml

      - name: Align Kotlin dependencies
        run: |
          cat > kotlin-fix.gradle <<'EOF'
          allprojects {
              configurations.configureEach {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew -I ../kotlin-fix.gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANKIT-TIME-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
