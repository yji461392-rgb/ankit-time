
name: Build ANKIT TIME APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Download website
        run: |
          mkdir -p www
          curl -fL "https://yji461392-rgb.github.io/ankit-time/" -o www/index.html
          test -s www/index.html

      - name: Configure Android app
        run: |
          npx cap init "ANKIT TIME" "com.ankittime.study" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Prepare launcher icons
        run: |
          sudo apt-get install -y imagemagick
          test -f app-icon.jpg

          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26

          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            folder="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$folder"

            convert app-icon.jpg \
              -resize "${size}x${size}^" \
              -gravity center \
              -extent "${size}x${size}" \
              "$folder/ic_launcher.png"

            cp "$folder/ic_launcher.png" "$folder/ic_launcher_round.png"
          done

          convert app-icon.jpg \
            -resize 432x432^ \
            -gravity center \
            -extent 432x432 \
            android/app/src/main/res/drawable/ankit_icon.png

          cat > android/app/src/main/res/values/launcher_colors.xml <<'EOF'
          <resources>
              <color name="launcher_background">#080E13</color>
          </resources>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/launcher_background"/>
              <foreground android:drawable="@drawable/ankit_icon"/>
          </adaptive-icon>
          EOF

          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
             android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Align Kotlin dependencies
        run: |
          cat > kotlin-fix.gradle <<'EOF'
          allprojects {
              configurations.configureEach {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew -I ../kotlin-fix.gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANKIT-TIME-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
